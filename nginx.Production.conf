events { worker_connections 1024; }

http {
    upstream api_hub {
        server api.hub:1453; 
    }

    upstream api_open {
        server api.open:1071; 
    }

    upstream api_integration {
        server api.integration:1010; 
    }

    upstream api_web {
        server api.web:1030; 
    }

    server {
        listen 80;
        server_name api.backendengineer.info;

        location /hub {
            proxy_pass         http://api_hub;
            proxy_redirect     off;
            
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /openapi/ {
            proxy_pass         http://api_open/openapi/;
            proxy_redirect     off;
            
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /integrationapi/ {
            proxy_pass         http://api_integration/integrationapi/;
            proxy_redirect     off;
            
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /webapi/ {
            proxy_pass         http://api_web/webapi/;
            proxy_redirect     off;
            
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
