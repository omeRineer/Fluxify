name: "fluxify-production"
services:
  nginx:
    image: nginx:latest
    container_name: fluxify.nginx
    ports:
      - "1020:80"
      - "443:443"
    networks: 
      - appnet
    volumes:
      - ./nginx.Production.conf:/etc/nginx/nginx.conf:ro
      
  db.mongo:
    image: mongodb/mongodb-community-server:latest
    container_name: fluxify.db.mongodb
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - appnet
    volumes:
      - mongo_data:/data/db

  db.postgres:
    image: postgres:latest
    container_name: fluxify.db.postgres
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - POSTGRES_USER=fluxify
      - POSTGRES_PASSWORD=Ja35e6#C2R
      - POSTGRES_DB=fluxify
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - appnet
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:management
    container_name: fluxify.rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=fluxify
      - RABBITMQ_DEFAULT_PASS=fluxify
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  
  api.open:
    container_name: fluxify.api.open
    build:
      context: .
      dockerfile: Fluxify.Api.Open/dockerfile.Production
    depends_on:
      rabbitmq:
        condition: service_healthy
      db.mongo:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:1071
    networks:
      - appnet

  api.integration:
    container_name: fluxify.api.integration
    build:
      context: .
      dockerfile: Fluxify.Api.Integration/dockerfile.Production
    depends_on:
      rabbitmq:
        condition: service_healthy
      db.mongo:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:1010
    networks:
      - appnet

  api.web:
    container_name: fluxify.api.web
    build:
      context: .
      dockerfile: Fluxify.Api.Web/dockerfile.Production
    depends_on:
      rabbitmq:
        condition: service_healthy
      db.mongo:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:1030
    networks:
      - appnet

  api.hub:
    container_name: fluxify.api.hub
    build:
      context: .
      dockerfile: Fluxify.Api.Hub/dockerfile.Production
    depends_on:
      db.mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:1453
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
    